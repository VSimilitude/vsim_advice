<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask VSim</title>
<meta name="description" content="Keyword-matched Last War: Survival strategy advice.">
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --accent: #c2410c; --accent-text: #ffffff; --border: #d9d4c7;
    --cane: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a; --panel: #1f2226; --text: #ecebe6; --muted: #9a9890;
      --accent: #f97316; --accent-text: #15171a; --border: #33373d; --cane: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --panel: #1f2226; --text: #ecebe6; --muted: #9a9890;
    --accent: #f97316; --accent-text: #15171a; --border: #33373d; --cane: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px; min-height: 100vh;
  }
  main { max-width: 640px; margin: 12vh auto 0; }
  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] {
    flex: 1 1 260px; padding: 12px 14px; font-size: 1rem; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    padding: 12px 18px; font-size: 1rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px;
  }
  button:active { transform: translateY(1px); }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.95rem; color: var(--muted); }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .card {
    margin-top: 20px; padding: 18px 20px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .card h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .card p { margin: 0; white-space: pre-line; }
  .card.cane h2 { color: var(--cane); text-transform: uppercase; letter-spacing: 0.03em; }
  .card.cane p { font-size: 1.1rem; font-weight: 600; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <form id="ask">
    <input id="q" type="text" autocomplete="off" autofocus aria-label="Your question">
    <button type="submit">Ask VSim</button>
  </form>
  <div class="checkbox-row">
    <input type="checkbox" id="cane-mode">
    <label for="cane-mode">Cane-mode</label>
  </div>

  <section id="out" class="card hidden" aria-live="polite">
    <h2 id="title" class="hidden"></h2>
    <p id="body"></p>
  </section>
</main>

<script src="advice.js"></script>
<script>
// Advice entries live in advice.js: { text, cane, life? }.
// Matching: each query word is stemmed and compared against the stemmed words of
// every blurb's normal text (plus synonyms). Score = distinct query words that hit.
const ADVICE = window.ADVICE || [];

const STOP = new Set(("what is the best a an for to in of and how do i my should which on with are can get me about " +
  "some any good be it its this that you your or not just when where why who will would could does did have has had use using make need want " +
  "than then there their they them these those more most much many very also into from but if at as by so up out no " +
  "yes all one two three first last war game last-war lastwar vsim ask tell tip tips advice help please").split(" "));

const SYN = {
  gem: "diamond", gems: "diamond", diamonds: "diamond",
  plane: "aircraft", planes: "aircraft", air: "aircraft", jet: "aircraft",
  vs: "duel", versus: "duel",
  f2p: "free", cheap: "free", budget: "free", spender: "free",
  hq: "headquarters", base: "headquarters",
  ds: "desert", storm: "desert",
  money: "gold", cash: "gold",
  tech: "research", science: "research",
  troops: "troop", army: "troop", soldiers: "troop",
  build: "building", construct: "building",
  ar: "arms", race: "arms",
  team: "squad", lineup: "formation", comp: "formation",
  timing: "day", when: "day", calendar: "day",
  hero: "heroes", heros: "heroes",
  shard: "shards", medal: "medals", speedup: "speedups", speed: "speedups"
};

function stem(w) {
  if (w.length > 5 && w.endsWith("ing")) return w.slice(0, -3);
  if (w.length > 5 && w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.length > 4 && w.endsWith("ed")) return w.slice(0, -2);
  if (w.length > 4 && w.endsWith("es")) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith("s")) return w.slice(0, -1);
  return w;
}
function words(text) {
  return text.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9]+/g, " ").split(" ")
    .filter(w => w && !STOP.has(w));
}
// Precompute stemmed word sets for every blurb, and how many blurbs each stem
// appears in. Rare words (tank, radar) count for more than common ones (building).
const INDEX = ADVICE.map(a => new Set(words(a.text).map(stem)));
const DF = new Map();
for (const set of INDEX) for (const w of set) DF.set(w, (DF.get(w) || 0) + 1);
const weight = w => 1 / (DF.get(w) || 1);

function queryStems(q) {
  const out = new Set();
  for (const w of words(q)) {
    out.add(stem(w));
    if (SYN[w]) out.add(stem(SYN[w]));
  }
  return [...out];
}

let lastPick = null;
const LIFE_CHANCE = 1 / 12; // occasional off-topic life advice, whatever you asked

function pick(query) {
  const life = ADVICE.filter(a => a.life);
  if (life.length && Math.random() < LIFE_CHANCE) {
    const pool = life.filter(a => a !== lastPick);
    return lastPick = pool[Math.floor(Math.random() * pool.length)];
  }
  const qs = queryStems(query);
  const scored = [];
  ADVICE.forEach((a, i) => {
    let score = 0;
    for (const s of qs) {
      if (INDEX[i].has(s)) { score += weight(s); continue; }
      // prefix match for longer stems (e.g. "research" vs "researching")
      if (s.length >= 5) for (const w of INDEX[i]) {
        if (w.startsWith(s) || (s.startsWith(w) && w.length >= 5)) { score += weight(w); break; }
      }
    }
    if (score > 0) scored.push({ a, score: score * score }); // square to sharpen
  });
  if (!scored.length) {
    // No keyword hit: uniform random over everything except the last answer.
    const pool = ADVICE.filter(a => a !== lastPick);
    return lastPick = pool[Math.floor(Math.random() * pool.length)];
  }
  // Weighted random over keyword score. With 3+ candidates, never repeat.
  const pool = scored.length > 2 ? scored.filter(s => s.a !== lastPick) : scored;
  const total = pool.reduce((sum, s) => sum + s.score, 0);
  let r = Math.random() * total;
  for (const s of pool) {
    r -= s.score;
    if (r <= 0) return lastPick = s.a;
  }
  return lastPick = pool[pool.length - 1].a;
}

const out = document.getElementById("out");
const titleEl = document.getElementById("title");
document.getElementById("ask").addEventListener("submit", e => {
  e.preventDefault();
  const cane = document.getElementById("cane-mode").checked;
  const q = document.getElementById("q").value.trim();
  const hit = pick(q);
  if (!hit) return;
  titleEl.textContent = "OKAY LISTEN UP!";
  titleEl.classList.toggle("hidden", !cane);
  document.getElementById("body").textContent = cane ? hit.cane : hit.text;
  out.classList.toggle("cane", cane);
  out.classList.remove("hidden");
});
</script>
</body>
</html>
